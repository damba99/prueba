<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estadísticas de Caja | Arre Caballito</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Merriweather', serif;
            background-color: rgb(244, 244, 244);
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 40px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(255, 0, 93, 0.2);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: rgb(255, 0, 93);
            font-size: 2.2em;
            margin-bottom: 30px;
            text-align: center;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: rgb(211, 5, 50);
            font-size: 1.5em;
            margin-bottom: 20px;
            border-bottom: 2px solid rgb(211, 5, 50);
            padding-bottom: 8px;
        }

        .info-box {
            background-color: #f7f7f7;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .info-box p {
            margin: 10px 0;
            font-size: 1.1em;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .chart-container {
            margin: 30px 0;
            padding: 20px;
            background-color: #f7f7f7;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-volver {
            background-color: #17a2b8;
            color: white;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-align: center;
            display: block;
            margin: 0 auto;
        }

        .btn-volver:hover {
            background-color: #138496;
        }

        @media screen and (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .section h2 {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Estadísticas de Ingresos y Egresos</h1>

    <div class="section">
        <h2>Estadísticas Mensuales</h2>
        <div class="chart-container">
            <canvas id="statsChart"></canvas>
        </div>
    </div>

    <button class="btn-volver" onclick="window.location.href='#';">Ir a Listado de Cajas</button>
</div>

<script>
    // Datos de ejemplo para los gráficos
    const labels = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    const data = {
        labels: labels,
        datasets: [
            {
                label: 'Ingresos',
                data: [1200, 1300, 1100, 1500, 1400, 1600, 1700, 1800, 1500, 1600, 1400, 1700], // Ingresos de cada mes
                borderColor: 'rgb(255, 99, 132)',
                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                fill: true,
            },
            {
                label: 'Egresos',
                data: [800, 900, 850, 1200, 1100, 1300, 1400, 1500, 1200, 1300, 1200, 1100], // Egresos de cada mes
                borderColor: 'rgb(54, 162, 235)',
                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                fill: true,
            }
        ]
    };

    const config = {
        type: 'line', // Tipo de gráfico (línea)
        data: data,
        options: {
            responsive: true,
            plugins: {
                title: {
                    display: true,
                    text: 'Gráfico de Ingresos y Egresos Mensuales'
                },
                tooltip: {
                    mode: 'index',
                    intersect: false,
                },
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: 'Mes'
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: 'Monto ($)'
                    }
                }
            }
        }
    };

    const ctx = document.getElementById('statsChart').getContext('2d');
    new Chart(ctx, config);
</script>

</body>
</html>
