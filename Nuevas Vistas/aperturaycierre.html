<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Apertura y Cierre de Caja | Arre Caballito</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Merriweather', serif;
            background-color: rgb(244, 244, 244);
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 40px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(255, 0, 93, 0.2);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: rgb(255, 0, 93);
            font-size: 2.2em;
            margin-bottom: 30px;
            text-align: center;
        }

        .section {
            margin-bottom: 50px;
        }

        .section h2 {
            color: rgb(211, 5, 50);
            font-size: 1.5em;
            margin-bottom: 20px;
            border-bottom: 2px solid rgb(211, 5, 50);
            padding-bottom: 8px;
        }

        form {
            display: grid;
            gap: 20px;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
        }

        button {
            background-color: rgb(255, 0, 93);
            color: white;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: rgb(211, 5, 50);
        }

        @media screen and (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .section h2 {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Apertura y Cierre de Caja</h1>

    <div class="section">
        <h2>Apertura de Caja</h2>
        <form action="#" method="post">
            <label for="monto_apertura">Monto de Apertura:</label>
            <input type="number" step="0.01" id="monto_apertura" name="monto_apertura" required>
            <button type="submit">Guardar Apertura</button>
        </form>
    </div>
</body>
</html>
