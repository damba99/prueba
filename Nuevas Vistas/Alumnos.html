<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Asistencia de Alumnos | Arre Caballito</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Merriweather', serif;
            background-color: rgb(244, 244, 244);
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 40px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(255, 0, 93, 0.2);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: rgb(255, 0, 93);
            font-size: 2.2em;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ccc;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background-color: rgb(255, 0, 93);
            color: white;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 0.95em;
        }

        .btn {
            padding: 6px 10px;
            margin-right: 5px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-ver { background-color: #17a2b8; color: white; }
        .btn-editar { background-color: #ffc107; color: black; }
        .btn-eliminar { background-color: #dc3545; color: white; }

        .btn-ver:hover { background-color: #138496; }
        .btn-editar:hover { background-color: #e0a800; }
        .btn-eliminar:hover { background-color: #c82333; }

        .asistencia-presente { background-color: #d4edda; }
        .asistencia-ausente { background-color: #f8d7da; }
        .asistencia-justificado { background-color: #fff3cd; }
    </style>
</head>
<body>

<div class="container">
    <h1>Lista de Alumnos - Asistencia</h1>

    <form method="POST">
        {% csrf_token %}
        <table>
            <thead>
                <tr>
                    <th>Día</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Asistencia</th>
                    <th>Caballo Asignado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Repetir este bloque por cada alumno -->
                <tr>
                    <td>Lunes</td>
                    <td>Juan</td>
                    <td>Pérez</td>
                    <td>
                        <select name="asistencia_juan" class="asistencia">
                            <option value="presente" selected>Presente</option>
                            <option value="ausente">Ausente</option>
                            <option value="justificado">Justificado</option>
                        </select>
                    </td>
                    <td><input type="text" name="caballo_juan" placeholder="Nombre del caballo" required></td>
                    <td>
                        <button class="btn btn-ver" type="button">Ver</button>
                        <button class="btn btn-editar" type="button">Editar</button>
                    </td>
                </tr>
                <tr>
                    <td>Jueves</td>
                    <td>Ana</td>
                    <td>González</td>
                    <td>
                        <select name="asistencia_ana" class="asistencia">
                            <option value="presente">Presente</option>
                            <option value="ausente" selected>Ausente</option>
                            <option value="justificado">Justificado</option>
                        </select>
                    </td>
                    <td><input type="text" name="caballo_ana" required></td>
                    <td>
                        <button class="btn btn-ver" type="button">Ver</button>
                        <button class="btn btn-editar" type="button">Editar</button>
                    </td>
                </tr>
                <!-- Fin bloque -->
            </tbody>
        </table>

        <br>
        <button type="submit" class="btn btn-ver">Guardar Asistencia</button>
    </form>
</div>

<script>
    // Aplica color a la fila según asistencia seleccionada
    const selects = document.querySelectorAll('.asistencia');
    selects.forEach(select => {
        select.addEventListener('change', function () {
            const row = this.closest('tr');
            row.classList.remove('asistencia-presente', 'asistencia-ausente', 'asistencia-justificado');
            if (this.value === 'presente') row.classList.add('asistencia-presente');
            if (this.value === 'ausente') row.classList.add('asistencia-ausente');
            if (this.value === 'justificado') row.classList.add('asistencia-justificado');
        });
        select.dispatchEvent(new Event('change'));
    });
</script>

</body>
</html>
