{% extends "base.html" %}

{% block content %}
  <h1>Modificar Caballo</h1>
  <form method="POST" id="form-modificar-caballo">
    {% csrf_token %}
    
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" value="{{ caballo.nombre }}" required><br>
    
    <label for="edad">Edad:</label>
    <input type="number" id="edad" name="edad" value="{{ caballo.edad }}" required><br>
    
    <label for="sexo">Sexo:</label>
    <select name="sexo" id="sexo" required>
      <option value="M" {% if caballo.sexo == 'M' %}selected{% endif %}>Macho</option>
      <option value="H" {% if caballo.sexo == 'H' %}selected{% endif %}>Hembra</option>
    </select><br>
    
    <label for="disciplinas">Disciplinas:</label><br>
    {% for disciplina in disciplinas %}
      <input type="checkbox" name="disciplinas" value="{{ disciplina.id_disciplina }}"
      {% if disciplina in caballo.disciplinas.all %}checked{% endif %}>
      {{ disciplina.nombre }}<br>
    {% endfor %}
    
    <button type="submit" class="btn btn-success">Guardar Modificaciones</button>
  </form>

  <a href="{% url 'listar_caballos' %}" class="btn btn-secundario">Volver a la lista</a>

  <!-- Incluir SweetAlert2 si no está ya incluido en base.html -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    const form = document.getElementById('form-modificar-caballo');

    form.addEventListener('submit', function (e) {
      e.preventDefault(); // Evita envío automático

      Swal.fire({
        title: "¿Estás seguro?",
        text: "Se guardarán los cambios del caballo.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Sí, guardar",
        cancelButtonText: "Cancelar",
        customClass: {
          confirmButton: "btn btn-success",
          cancelButton: "btn btn-danger"
        },
        buttonsStyling: false
      }).then((result) => {
        if (result.isConfirmed) {
          form.submit(); // Envía el formulario si confirma
        }
      });
    });
  </script>
{% endblock %}
