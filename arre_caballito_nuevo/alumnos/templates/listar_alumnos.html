{% extends "base.html" %}

{% block content %}
  <h1>Lista de Alumnos</h1>
  <ul>
    {% for alumno in alumnos %}
      <li>
        <a href="{% url 'detalle_alumno' pk=alumno.pk %}">{{ alumno.nombre }} {{ alumno.apellido }}</a>
        <a href="{% url 'modificar_alumno' pk=alumno.pk %}">Editar</a>
        <a href="{% url 'eliminar_alumno' pk=alumno.pk %}">Eliminar</a>
      </li>
    {% endfor %}
  </ul>
  <a href="{% url 'crear_alumno' %}">Crear Alumno</a>
{% endblock %}
