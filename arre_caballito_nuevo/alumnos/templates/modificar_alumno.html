{% extends "base.html" %}

{% block content %}
  <h1>Modificar Alumno</h1>
  <form method="POST">
    {% csrf_token %}
    
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" value="{{ alumno.nombre }}" required>
    
    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido" value="{{ alumno.apellido }}" required>
    
    <label for="dni">DNI:</label>
    <input type="text" id="dni" name="dni" value="{{ alumno.dni }}" required>
    
    <label for="fecha_nacimiento">Fecha de nacimiento:</label>
    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" value="{{ alumno.fecha_nacimiento }}" required>
    
    <label for="direccion">Dirección:</label>
    <input type="text" id="direccion" name="direccion" value="{{ alumno.direccion }}" required>
    
    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" name="telefono" value="{{ alumno.telefono }}">
    
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="{{ alumno.email }}" required>
    
    <label for="id_categoria">Categoría:</label>
    <select id="id_categoria" name="id_categoria" required>
      {% for categoria in categorias %}
        <option value="{{ categoria.id_categoria }}" {% if categoria.id == alumno.id_categoria.id %} selected {% endif %}>{{ categoria.nombre }}</option>
      {% endfor %}
    </select>

    <!-- Tipo de sangre -->
    <label for="tipo_sangre">Tipo de sangre:</label>
    <select id="tipo_sangre" name="tipo_sangre">
      <option value="">-- Seleccione --</option>
      <option value="A+" {% if alumno.tipo_sangre == "A+" %} selected {% endif %}>A+</option>
      <option value="A-" {% if alumno.tipo_sangre == "A-" %} selected {% endif %}>A-</option>
      <option value="B+" {% if alumno.tipo_sangre == "B+" %} selected {% endif %}>B+</option>
      <option value="B-" {% if alumno.tipo_sangre == "B-" %} selected {% endif %}>B-</option>
      <option value="AB+" {% if alumno.tipo_sangre == "AB+" %} selected {% endif %}>AB+</option>
      <option value="AB-" {% if alumno.tipo_sangre == "AB-" %} selected {% endif %}>AB-</option>
      <option value="O+" {% if alumno.tipo_sangre == "O+" %} selected {% endif %}>O+</option>
      <option value="O-" {% if alumno.tipo_sangre == "O-" %} selected {% endif %}>O-</option>
    </select>

    <button type="submit">Modificar</button>
  </form>

  <a href="{% url 'listar_alumnos' %}">Volver a la lista</a>
{% endblock %}
