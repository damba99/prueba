{% extends "base.html" %}

{% block content %}
  <h1>Modificar Alumno</h1>

  <form method="POST" id="form-modificar-alumno">
    {% csrf_token %}
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" value="{{ alumno.nombre }}" required>
    
    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido" value="{{ alumno.apellido }}" required>
    
    <label for="dni">DNI:</label>
    <input type="text" id="dni" name="dni" value="{{ alumno.dni }}" required>
    
    <label for="fecha_nacimiento">Fecha de nacimiento:</label>
    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" value="{{ alumno.fecha_nacimiento }}" required>
    
    <label for="direccion">Dirección:</label>
    <input type="text" id="direccion" name="direccion" value="{{ alumno.direccion }}" required>
    
    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" name="telefono" value="{{ alumno.telefono }}">
    
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="{{ alumno.email }}" required>
    
    <label for="id_categoria">Categoría:</label>
    <select id="id_categoria" name="id_categoria" required>
      {% for categoria in categorias %}
        <option value="{{ categoria.id_categoria }}" {% if categoria.id == alumno.id_categoria.id %} selected {% endif %}>{{ categoria.nombre }}</option>
      {% endfor %}
    </select>

    <button type="submit" class="btn btn-primary">Modificar</button>
  </form>

  <a href="{% url 'listar_alumnos' %}" class="btn btn-secundario">Volver a la lista</a>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    const form = document.getElementById('form-modificar-alumno');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      Swal.fire({
        title: '¿Estás seguro?',
        text: '¿Deseas guardar los cambios realizados al alumno?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Sí, guardar',
        cancelButtonText: 'Cancelar',
        reverseButtons: true,
        customClass: {
          confirmButton: 'btn btn-success',
          cancelButton: 'btn btn-danger'
        },
        buttonsStyling: false
      }).then((result) => {
        if (result.isConfirmed) {
          form.submit();
        } else {
          Swal.fire({
            title: 'Cancelado',
            text: 'Los cambios no fueron guardados.',
            icon: 'info',
            confirmButtonText: 'OK',
            customClass: {
              confirmButton: 'btn btn-primary'
            },
            buttonsStyling: false
          });
        }
      });
    });
  </script>
{% endblock %}
