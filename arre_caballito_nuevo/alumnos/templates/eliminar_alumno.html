{% extends "base.html" %}

{% block content %}
  <h1>¿Estás seguro de que quieres eliminar a {{ alumno.nombre }} {{ alumno.apellido }}?</h1>
  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirmar eliminación</button>
  </form>
  <a href="{% url 'listar_alumnos' %}" class="btn btn-secundario">Cancelar</a>
{% endblock %}
