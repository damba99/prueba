{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Restablecer Contraseña</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .slideshow-container {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      z-index: -1;
    }

    .slideshow-image {
      position: absolute;
      height: 100%;
      width: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slideshow-image.active {
      opacity: 1;
    }

    .home-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: rgba(255, 255, 255, 0.7);
      color: #ff0044;
      border: 2px solid #ff0044;
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      z-index: 2;
    }

    .home-button:hover {
      background-color: #ff0044;
      color: white;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(255, 0, 102, 0.9);
      max-width: 450px;
      width: 90%;
      z-index: 1;
    }

    h2 {
      color: #ff0044;
      margin-bottom: 20px;
      text-align: center;
    }

    label {
      font-weight: bold;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
    }

    input:focus {
      border-color: #ff0044;
      outline: none;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .checkbox-container input[type="checkbox"] {
      margin-right: 10px;
      accent-color: #ff0044;
    }

    button {
      background-color: #ff0044;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 1em;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #c60034;
    }

    .error-message {
      color: red;
      font-size: 0.95em;
      margin-bottom: 15px;
      text-align: center;
    }

    .password-rules {
      font-size: 0.9em;
      margin-bottom: 20px;
      list-style: disc;
      padding-left: 20px;
      color: #333;
    }

    .password-rules li.invalid {
      color: red;
      font-weight: bold;
    }

    #mensajeCoincidencia {
      font-size: 0.95em;
      text-align: center;
      margin-top: -10px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <!-- Fondo animado -->
  <div class="slideshow-container">
    <div class="slideshow-image active" style="background-image: url('{% static "imagen/imagen1.jpg" %}');"></div>
    <div class="slideshow-image" style="background-image: url('{% static "imagen/imagen2.jpg" %}');"></div>
    <div class="slideshow-image" style="background-image: url('{% static "imagen/imagen3.jpeg" %}');"></div>
  </div>

  <!-- Botón volver al inicio -->
  <a class="home-button" href="/">← Volver al inicio</a>

  <div class="login-container">
    <h2>Restablecer Contraseña</h2>

    <!-- Reglas visibles -->
    <ul class="password-rules" id="passwordRules">
      <li id="regla1">Debe tener al menos una mayúscula</li>
      <li id="regla2">Debe tener al menos una minúscula</li>
      <li id="regla3">Debe tener al menos un número</li>
      <li id="regla4">Debe tener al menos 8 caracteres</li>
    </ul>

    {% if error %}
      <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="post" onsubmit="return validarFormulario()">
      {% csrf_token %}

      <label for="nueva_pass">Nueva Contraseña</label>
      <input type="password" name="nueva_pass" id="nueva_pass" required oninput="verificarCoincidencia()">

      <label for="confirmar_pass">Confirmar Contraseña</label>
      <input type="password" name="confirmar_pass" id="confirmar_pass" required oninput="verificarCoincidencia()">

      <div id="mensajeCoincidencia"></div>

      <div class="checkbox-container">
        <input type="checkbox" id="mostrarPassword" onclick="togglePassword()">
        <label for="mostrarPassword">Mostrar contraseña</label>
      </div>

      <button type="submit">Cambiar Contraseña</button>
    </form>
  </div>

  <script>
    function togglePassword() {
      const tipo = document.getElementById("mostrarPassword").checked ? "text" : "password";
      document.getElementById("nueva_pass").type = tipo;
      document.getElementById("confirmar_pass").type = tipo;
    }

    function verificarCoincidencia() {
      const pass1 = document.getElementById("nueva_pass").value;
      const pass2 = document.getElementById("confirmar_pass").value;
      const mensaje = document.getElementById("mensajeCoincidencia");

      if (!pass1 || !pass2) {
        mensaje.textContent = "";
        return;
      }

      if (pass1 === pass2) {
        mensaje.textContent = "Las contraseñas coinciden.";
        mensaje.style.color = "green";
      } else {
        mensaje.textContent = "Las contraseñas no coinciden.";
        mensaje.style.color = "red";
      }
    }

    function validarFormulario() {
      const pass = document.getElementById("nueva_pass").value;

      const regla1 = document.getElementById("regla1");
      const regla2 = document.getElementById("regla2");
      const regla3 = document.getElementById("regla3");
      const regla4 = document.getElementById("regla4");

      let valido = true;

      if (!/[A-Z]/.test(pass)) {
        regla1.classList.add("invalid");
        valido = false;
      } else {
        regla1.classList.remove("invalid");
      }

      if (!/[a-z]/.test(pass)) {
        regla2.classList.add("invalid");
        valido = false;
      } else {
        regla2.classList.remove("invalid");
      }

      if (!/[0-9]/.test(pass)) {
        regla3.classList.add("invalid");
        valido = false;
      } else {
        regla3.classList.remove("invalid");
      }

      if (pass.length < 8) {
        regla4.classList.add("invalid");
        valido = false;
      } else {
        regla4.classList.remove("invalid");
      }

      return valido;
    }

    // Fondo animado rotativo
    const slides = document.querySelectorAll('.slideshow-image');
    let index = 0;
    setInterval(() => {
      slides[index].classList.remove('active');
      index = (index + 1) % slides.length;
      slides[index].classList.add('active');
    }, 6000);
  </script>

</body>
</html>
