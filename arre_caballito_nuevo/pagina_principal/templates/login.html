{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .slideshow-container {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      z-index: -1;
    }

    .slideshow-image {
      position: absolute;
      height: 100%;
      width: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slideshow-image.active {
      opacity: 1;
    }

    .home-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: rgba(255, 255, 255, 0.7);
      color: #ff0044;
      border: 2px solid #ff0044;
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      z-index: 2;
    }

    .home-button:hover {
      background-color: #ff0044;
      color: white;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 90%;
      z-index: 1;
    }

    h2 {
      color: #ff0044;
      margin-bottom: 30px;
      text-align: center;
      font-size: 1.8em;
    }

    label {
      font-weight: bold;
      margin-bottom: 6px;
      display: block;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #ff0044;
      outline: none;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    .checkbox-container input {
      margin-right: 10px;
      accent-color: #ff0044;
    }

    .checkbox-container label {
      font-weight: normal;
      font-size: 0.95em;
      color: #444;
    }

    button {
      background-color: #ff0044;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 1em;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #c60034;
    }
  </style>
</head>
<body>

  <!-- Fondo con imágenes -->
  <div class="slideshow-container">
    <div class="slideshow-image active" style="background-image: url('{% static "imagen/imagen1.jpg" %}');"></div>
    <div class="slideshow-image" style="background-image: url('{% static "imagen/imagen2.jpg" %}');"></div>
    <div class="slideshow-image" style="background-image: url('{% static "imagen/imagen3(2).jpg" %}');"></div>
  </div>

  <!-- Botón para volver al inicio -->
  <a class="home-button" href="/">← Volver al inicio</a>

  <!-- Formulario de login -->
  <div class="login-container">
    <h2>Iniciar sesión</h2>

    <form method="POST" action="{% url 'iniciar_sesion' %}">
      {% csrf_token %}
      <label for="username">Nombre de usuario</label>
      <input type="text" id="username" name="username" required placeholder="Ingresa tu nombre de usuario">

      <div>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña" style="margin-bottom: 0;">
        {% if error %}
          <p style="color: red;">{{ error }}</p>
        {% endif %}
      </div>


      <div class="checkbox-container">
        <input type="checkbox" id="mostrarPassword" onclick="togglePassword()">
        <label for="mostrarPassword">Mostrar contraseña</label>
      </div>


      <button type="submit">Iniciar sesión</button>
      <a href="{% url 'recuperar_password' %}" style="color: #ff0044; text-decoration: none; font-size: 0.95em;">
        ¿Olvidaste tu contraseña?
      </a>
    </form>
  </div>

  <!-- Script para mostrar contraseña -->
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      passwordInput.type = passwordInput.type === "password" ? "text" : "password";
    }

    // Script para cambiar imágenes de fondo
    const slides = document.querySelectorAll('.slideshow-image');
    let index = 0;

    setInterval(() => {
      slides[index].classList.remove('active');
      index = (index + 1) % slides.length;
      slides[index].classList.add('active');
    }, 6000);
  </script>

</body>
</html>
