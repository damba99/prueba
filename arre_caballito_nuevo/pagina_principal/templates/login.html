<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f8f8;
      color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background-color: #ffffff;
      padding: 40px;
      border: 1px solid #ccc;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
      max-width: 400px;
      width: 100%;
    }

    h2 {
      color: #ff0044;
      margin-bottom: 30px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1em;
    }

    input:focus {
      border-color: #ff0044;
      outline: none;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .checkbox-container input[type="checkbox"] {
      margin-right: 10px;
      accent-color: #ff0044;
    }

    .checkbox-container label {
      font-weight: normal;
      font-size: 0.95em;
      color: #333;
    }

    button {
      background-color: #ff0044;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #c60034;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Iniciar sesión</h2>

    <form method="POST" action="{% url 'iniciar_sesion' %}">
      {% csrf_token %}

      <div>
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" required placeholder="Ingresa tu nombre de usuario">
      </div>

      <div>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña">
      </div>

      <div class="checkbox-container">
        <input type="checkbox" id="mostrarPassword" onclick="togglePassword()">
        <label for="mostrarPassword">Mostrar contraseña</label>
      </div>

      <button type="submit">Iniciar sesión</button>
      <a href="{% url 'recuperar_password' %}" style="color: #ff0044; text-decoration: none; font-size: 0.95em;">
        ¿Olvidaste tu contraseña?
      </a>
    </form>
  </div>
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const checkbox = document.getElementById("mostrarPassword");
      passwordInput.type = checkbox.checked ? "text" : "password";
    }
  </script>

</body>
</html>
