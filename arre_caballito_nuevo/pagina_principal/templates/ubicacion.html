<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación</title>
    {% load static %}  <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            height: 100vh;
            background: url("{% static 'imagen/imagen1.jpg' %}"), url("{% static 'imagen/imagen2.jpg' %}"), url("{% static 'imagen/imagen3.jpg' %}"); /* Reemplaza con tus imágenes */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            animation: backgroundChange 30s infinite;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background images (multiple, simultaneous) */
        @keyframes backgroundChange {
            0% {
                background-image: url("{% static 'imagen/imagen1.jpg' %}"), url("{% static 'imagen/imagen2.jpg' %}"), url("{% static 'imagen/imagen3.jpg' %}");
            }
            50% {
                background-image: url("{% static 'imagen/imagen2.jpg' %}"), url("{% static 'imagen/imagen3.jpg' %}"), url("{% static 'imagen/imagen1.jpg' %}");
            }
            100% {
                background-image: url("{% static 'imagen/imagen3.jpg' %}"), url("{% static 'imagen/imagen1.jpg' %}"), url("{% static 'imagen/imagen2.jpg' %}");
            }
        }

        /* Main container styling */
        .container {
            background-color: rgba(255, 255, 255, 0.9); /* Fondo blanco con opacidad */
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 700px;
            color: #333; /* Color del texto */
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            transform: scale(0.95);
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            z-index: 2; /* Para que esté por encima del fondo */
            position: relative; /* Para que el botón "Volver" se posicione correctamente */
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Heading styles */
        h1 {
            font-size: 2.2em;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #333;
        }

        /* Map styling */
        .map {
            width: 100%;
            height: 350px;
            border-radius: 8px;
            border: 2px solid #d9a457; /* Borde con el color principal */
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .map:hover {
            transform: scale(1.03);
        }

        /* Back button styling */
        .back-button {
            background-color: #333; /* Color de fondo oscuro */
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 14px;
            color: white;
            text-decoration: none;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
            display: inline-block;
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .back-button:hover {
            background-color: #d9a457; /* Color principal al pasar el ratón */
        }

        /* Action button styling */
        .action-button {
            background-color: #d9a457; /* Color principal */
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .action-button:hover {
            background-color: #b37d4b;
            transform: translateY(-3px);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .map {
                height: 250px;
            }

            .action-button {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="{% url 'inicio' %}" class="back-button">Volver a la Página Principal</a>
    <h1>UBICACIÓN</h1>
    <iframe 
        class="map"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14652.460453348833!2d-65.59038985!3d-24.8737022!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x941befbba4abc0e3%3A0xbad30db82b8fa3f5!2sTaller%20ecuestre%20Arre%20Caballito!5e0!3m2!1ses-419!2sar!4v1699981092732!5m2!1ses-419!2sar" 
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>
    <div>
        <button class="action-button" onclick="encontrarnos()">ENCONTRANOS</button>
    </div>
</div>

<script>
    function encontrarnos() {
        alert("Abriendo ubicación en Google Maps...");
        window.open("https://www.google.com.ar/maps/place/Taller+ecuestre+Arre+Caballito/@-24.8773395,-65.5903899,15.75z/data=!4m6!3m5!1s0x941befbba4abc0e3:0xbad30db82b8fa3f5!8m2!3d-24.8737022!4d-65.5897074!16s%2Fg%2F11rphh85kq!5m1!1e4?coh=219816&entry=tts&g_ep=EgoyMDI0MDgxOS4wKgBIAVAD", "_blank");
    }
</script>

</body>
</html>
