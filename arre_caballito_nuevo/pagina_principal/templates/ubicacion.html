<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación</title>
    {% load static %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: url("{% static 'imagen/imagen1.jpg' %}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.55);
            border-radius: 15px;
            padding: 40px;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 10px 20px rgb(255, 3, 150);
            position: relative;
            text-align: center;
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
            transform: scale(0.95);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 25px;
            color: #333;
        }

        .map {
            width: 100%;
            height: 350px;
            border: 2px solidrgb(255, 7, 65);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(240, 15, 124, 0.23);
            margin-bottom: 25px;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .back-button:hover {
            background-color:rgba(255, 10, 108, 0.59);
        }

        .action-button {
            background-color:hsl(351, 97.40%, 53.90%);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .action-button:hover {
            background-color:rgb(242, 37, 99);
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .map {
                height: 250px;
            }

            .action-button {
                font-size: 14px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="{% url 'inicio' %}" class="back-button">Volver a la Página Principal</a>
    <h1>UBICACIÓN</h1>
    <iframe 
        class="map"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14652.460453348833!2d-65.59038985!3d-24.8737022!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x941befbba4abc0e3%3A0xbad30db82b8fa3f5!2sTaller%20ecuestre%20Arre%20Caballito!5e0!3m2!1ses-419!2sar!4v1699981092732!5m2!1ses-419!2sar" 
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
    </iframe>
    <button class="action-button" onclick="encontrarnos()">ENCONTRANOS</button>
</div>

<script>
    function encontrarnos() {
        alert("Abriendo ubicación en Google Maps...");
        window.open("https://www.google.com.ar/maps/place/Taller+ecuestre+Arre+Caballito/@-24.8773395,-65.5903899,15.75z/data=!4m6!3m5!1s0x941befbba4abc0e3:0xbad30db82b8fa3f5!8m2!3d-24.8737022!4d-65.5897074!16s%2Fg%2F11rphh85kq!5m1!1e4?coh=219816&entry=tts&g_ep=EgoyMDI0MDgxOS4wKgBIAVAD", "_blank");
    }
</script>

</body>
</html>
