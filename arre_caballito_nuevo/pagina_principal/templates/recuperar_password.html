{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recuperar Contraseña</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .slideshow-container {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      z-index: -1;
    }

    .slideshow-image {
      position: absolute;
      height: 100%;
      width: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .slideshow-image.active {
      opacity: 1;
    }

    .home-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: rgba(255, 255, 255, 0.7);
      color: #ff0044;
      border: 2px solid #ff0044;
      padding: 10px 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      z-index: 2;
    }

    .home-button:hover {
      background-color: #ff0044;
      color: white;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(255, 0, 102, 0.9);
      max-width: 400px;
      width: 90%;
      z-index: 1;
    }

    h2 {
      color: #ff0044;
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.8em;
    }

    p.instruction {
      text-align: center;
      font-size: 0.9em;
      color: #555;
      margin-bottom: 20px;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
    }

    input[type="email"].error {
      border-color: red;
    }

    .error-message {
      color: red;
      font-size: 0.9em;
      margin-bottom: 15px;
    }

    button {
      background-color: #ff0044;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-size: 1em;
      font-weight: bold;
      transition: background-color 0.3s ease;
      margin-top: 10px;
    }

    button:hover {
      background-color: #c60034;
    }

    .bottom-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #ff0044;
      text-decoration: none;
      font-size: 0.95em;
    }
  </style>
</head>
<body>

  <!-- Fondo con imágenes -->
  <div class="slideshow-container">
    <div class="slideshow-image active" style="background-image: url('{% static "imagen/imagen1.jpg" %}');"></div>
    <div class="slideshow-image" style="background-image: url('{% static "imagen/imagen2.jpg" %}');"></div>
    <div class="slideshow-image" style="background-image: url('{% static "imagen/imagen3.jpeg" %}');"></div>
  </div>

  <!-- Botón para volver al inicio -->
  <a class="home-button" href="/">← Volver al inicio</a>

  <!-- Formulario de recuperación -->
  <div class="login-container">
    <h2>Recuperar Contraseña</h2>
    <p class="instruction">
      Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
    </p>
    <form method="POST">
      {% csrf_token %}
      <input type="email" name="email" placeholder="Correo electrónico"
             class="{% if error %}error{% endif %}" required>
      {% if error %}
        <div class="error-message">Este correo no está registrado</div>
      {% endif %}
      <button type="submit">Enviar enlace</button>
    </form>
    <a href="{% url 'iniciar_sesion' %}" class="bottom-link">¿Ya la recordaste? Inicia sesión</a>
  </div>

  <!-- Script para rotar imágenes -->
  <script>
    const slides = document.querySelectorAll('.slideshow-image');
    let index = 0;

    setInterval(() => {
      slides[index].classList.remove('active');
      index = (index + 1) % slides.length;
      slides[index].classList.add('active');
    }, 6000);
  </script>

</body>
</html>
