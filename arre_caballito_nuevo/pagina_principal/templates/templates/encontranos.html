<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubicación</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f4e4c1, #e0d8c0);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        .container {
            width: 80%;
            max-width: 800px;
            background-color: #c28c3a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            transition: transform 0.3s ease;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container h1 {
            color: white;
            margin-top: 0;
            font-size: 36px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        }

        .btn-back {
            position: absolute;
            top: 30px;
            left: 30px;
            background-color: #d4a558;
            color: black;
            border: 2px solid #a87638; /* Borde más integrado */
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s ease, border-color 0.3s ease; /* Transición para el borde */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .btn-back:hover {
            background-color: #a87638;
            color: white;
            transform: translateY(-3px);
            border-color: #c28c3a; /* Cambio de color del borde al pasar el ratón */
        }

        .map-container {
            margin: 40px 0;
            border: 6px solid #d4a558;
            border-radius: 15px;
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .map-container:hover {
            border-color: #a87638;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        iframe {
            width: 100%;
            height: 450px;
            border: none;
        }

        .btn-find-us {
            background-color: #d4a558;
            color: black;
            padding: 15px 35px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: pulse 2s infinite ease-in-out;
        }

        .btn-find-us:hover {
            background-color: #a87638;
            color: white;
            transform: translateY(-3px);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-back" onclick="volver()">Volver</button>
        <h1>UBICACIÓN</h1>
        <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3618.6756816568285!2d-65.5925340248464!3d-24.87370217789493!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x941befbba4abc0e3%3A0xbad30db82b8fa3f5!2sTaller%20ecuestre%20Arre%20Caballito!5e0!3m2!1ses!2sar!4v1716383670183!5m2!1ses!2sar" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <a href="https://www.google.com.ar/maps/place/Taller+ecuestre+Arre+Caballito/@-24.8773395,-65.5903899,15z/data=!4m6!3m5!1s0x941befbba4abc0e3:0xbad30db82b8fa3f5!8m2!3d-24.8737022!4d-65.5897074!16s%2Fg%2F11rphh85kq!5m1!1e4?entry=ttu&g_ep=EgoyMDI0MTAyMy.wIKXMDSoASAFQAw%3D%3D" class="btn-find-us" target="_blank">ENCONTRANOS</a>
    </div>

    <script>
        function volver() {
            if (confirm("¿Estás seguro de que quieres volver?")) {
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
