<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Profesor</title>
    <style>
        body {
            background-color: #d9b36b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            animation: fadeIn 1.5s ease-out;
        }

        .form-container {
            background-color: #f9f3e2;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 5%;
            animation: slideInUp 1.2s ease-out;
        }

        h2 {
            color: #4b4b4b;
            text-align: center;
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: 600;
            text-shadow: 0px 2px 3px rgba(0, 0, 0, 0.1);
        }

        form {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .form-group {
            margin-bottom: 18px;
            width: 100%;
        }

        label {
            margin-bottom: 8px;
            color: #8a6d35;
            font-weight: 600;
            display: block;
            text-align: left;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.05);
        }

        input {
            padding: 14px;
            border: 1.5px solid #ccc;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            outline: none;
            transition: border-color 0.4s ease, box-shadow 0.3s ease;
        }

        input:focus {
            border-color: #8a6d35;
            box-shadow: 0 0 5px rgba(138, 109, 53, 0.7);
        }

        button {
            padding: 12px 25px;
            background-color: #8a6d35;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            margin-top: 25px;
            font-size: 16px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.15);
        }

        button:hover {
            background-color: #6d4f24;
            transform: scale(1.05); /* Le da un zoom suave al botón */
        }

        .volver-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            border: 2px solid #4b4b4b;
            border-radius: 50px;
            background: #d9b36b;
            color: black;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .volver-btn:hover {
            background-color: #6d4f24;
            transform: scale(1.05); /* Efecto de zoom suave */
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <button class="volver-btn" onclick="window.history.back()">Volver</button>
    <div class="form-container">
        <h2>Agregar Profesor</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar</button>
        </form>
    </div>
</body>
</html>
