<!DOCTYPE html>
<html>
<head>
    <title>Página de Rol</title>
    <style>
        body {
            padding: 20px;
        }

        /* Colores según el rol */
        .admin {
            background-color: #ffcccc;  /* Color para Administrador */
        }

        .profesor {
            background-color: #ccffcc;  /* Color para Profesor */
        }

        .alumno {
            background-color: #ccccff;  /* Color para Alumno */
        }

        .default {
            background-color: #f0f0f0;  /* Color por defecto */
        }
    </style>
</head>
<body class="{% if rol == 'Administrador' %}admin{% elif rol == 'Profesor' %}profesor{% elif rol == 'Alumno' %}alumno{% else %}default{% endif %}">
    <h1>Bienvenido a la página de Rol</h1>

    <p>Tu rol es: {{ rol }}</p>

    <!-- Botón de logout -->
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Cerrar sesión</button>
    </form>
</body>
</html>
