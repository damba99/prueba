{% extends "base.html" %}

{% block content %}
  <h1>Modificar Profesor</h1>
  <form method="POST">
    {% csrf_token %}
    <label for="monto">Nombre:</label>
    <input type="number" id="monto" name="monto" value="{{ monto.monto }}" required>

    <button type="submit">Modificar</button>
  </form>
  <a href="{% url 'listar_montos' %}">Volver a la lista</a>
{% endblock %}
