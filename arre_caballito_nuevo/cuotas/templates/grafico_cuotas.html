{% extends 'base.html' %}

{% block content %}
  <h2>Cuotas Pagadas vs Vencidas por Mes</h2>

  <canvas id="graficoCuotas" width="600" height="300"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const ctx = document.getElementById('graficoCuotas').getContext('2d');
    const myChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: {{ etiquetas|safe }},
        datasets: [
          {
            label: 'Pagadas',
            data: {{ pagadas|safe }},
            backgroundColor: 'rgba(75, 192, 192, 0.7)',
            borderColor: 'rgba(75, 192, 192, 1)',
            borderWidth: 1
          },
          {
            label: 'Vencidas',
            data: {{ vencidas|safe }},
            backgroundColor: 'rgba(255, 99, 132, 0.7)',
            borderColor: 'rgba(255, 99, 132, 1)',
            borderWidth: 1
          }
        ]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              stepSize: 1
            }
          }
        }
      }
    });
  </script>
{% endblock %}
