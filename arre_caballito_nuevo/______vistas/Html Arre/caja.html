<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apertura y Cierre de Caja</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      display: flex;
      background-color: #ffffff;
      color: #fff;
      height: 100vh;
    }

    .menu-toggle {
      position: absolute;
      top: 5px;
      left: 20px;
      font-size: 24px;
      cursor: pointer;
      z-index: 10;
      color: #ff0044;
      transition: transform 0.3s ease;
    }

    .menu-toggle:hover {
      transform: scale(1.1);
    }

    .menu {
      width: 190px;
      background-color: #000000;
      padding: 20px;
      transition: transform 0.4s ease;
      transform: translateX(0);
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
    }

    .menu.activo {
      transform: translateX(-190px);
    }

    .menu h2 {
      text-align: left;
      margin-bottom: 20px;
      color: #fff;
      font-weight: 700;
      font-size: 1.5em;
    }

    .menu ul {
      list-style: none;
      padding: 0;
    }

    .menu li {
      margin-bottom: 15px;
    }

    .menu a {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #ffffff;
      transition: color 0.3s ease;
      padding: 10px 15px;
      border-radius: 5px;
    }

    .menu a:hover {
      color: #000000;
      background-color: #408a9b;
    }

    .menu i {
      margin-right: 15px;
      color: #ff0051;
    }

    .contenido {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      margin-left: 200px;
      transition: margin-left 0.4s ease;
    }

    .menu.activo + .contenido {
      margin-left: 20px;
    }

    .formulario-caja {
      background: #fff;
      color: #000;
      max-width: 500px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.2);
    }

    .formulario-caja h2 {
      margin-top: 0;
      color: #ff0044;
      margin-bottom: 20px;
    }

    .formulario-caja label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    .formulario-caja input,
    .formulario-caja textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1em;
    }

    .btn-rojo {
      background-color: #ff0044;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .btn-rojo:hover {
      background-color: #c60034;
    }

    .info-caja-abierta {
      background-color: #f0f0f0;
      color: #000;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="menu-toggle">
    <i class="fas fa-bars"></i>
  </div>

  <div class="menu">
    <h2>Arre Caballito</h2>
    <ul>
      <li><a href="#"><i class="fas fa-calendar-alt"></i> Clases</a></li>
      <li><a href="#"><i class="fas fa-money-bill-wave"></i> Cuotas</a></li>
      <li><a href="#"><i class="fas fa-graduation-cap"></i> Académico</a></li>
      <li><a href="#"><i class="fas fa-cash-register"></i> Cajas y movimientos</a></li>
      <li><a href="#"><i class="fas fa-user-circle"></i> Perfil</a></li>
      <li><a href="#"><i class="fas fa-sign-out-alt"></i> Cerrar sesión</a></li>
    </ul>
  </div>

  <div class="contenido">
    <div class="formulario-caja">
      <h2>Apertura de Caja</h2>
      <label for="fecha">Fecha</label>
      <input type="date" id="fecha" />

      <label for="monto">Monto Inicial</label>
      <input type="number" id="monto" placeholder="Ej: 5000" />

      <label for="comentario">Comentario (opcional)</label>
      <textarea id="comentario" rows="3" placeholder="Ej: Apertura por turno mañana..."></textarea>

      <button class="btn-rojo" onclick="abrirCaja()">Abrir Caja</button>

      <div id="infoCaja" class="info-caja-abierta" style="display: none;">
        <p><strong>Caja Abierta:</strong> <span id="infoFecha"></span></p>
        <p><strong>Monto Inicial:</strong> $<span id="infoMonto"></span></p>
        <button class="btn-rojo" onclick="cerrarCaja()">Cerrar Caja</button>
      </div>
    </div>
  </div>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const menu = document.querySelector('.menu');
    const contenido = document.querySelector('.contenido');

    menuToggle.addEventListener('click', () => {
      menu.classList.toggle('activo');
      contenido.classList.toggle('expandido');
    });

    function abrirCaja() {
      const fecha = document.getElementById('fecha').value;
      const monto = document.getElementById('monto').value;

      if (!fecha || !monto) {
        alert('Por favor, completá la fecha y el monto inicial.');
        return;
      }

      document.getElementById('infoFecha').innerText = fecha;
      document.getElementById('infoMonto').innerText = monto;
      document.getElementById('infoCaja').style.display = 'block';
    }

    function cerrarCaja() {
      if (confirm('¿Estás seguro que querés cerrar la caja?')) {
        document.getElementById('infoCaja').style.display = 'none';
        alert('Caja cerrada correctamente.');
      }
    }
  </script>
</body>
</html>
