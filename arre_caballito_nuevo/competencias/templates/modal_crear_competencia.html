<div id="modal" style="display: none; position: fixed; top: 0; left: 0;
                     width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
  <div style="background: white; margin: 10% auto; padding: 20px; width: 400px; position: relative;">
    <span onclick="cerrarModal()" style="position: absolute; top: 10px; right: 15px; cursor: pointer;">&times;</span>
    
    <!-- Formulario en el modal -->
    <form method="POST" action="{% url 'crear_competencia' %}">
      {% csrf_token %}
      
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" required></textarea>

      <label for="lugar">Lugar</label>
      <input type="text" id="lugar" name="lugar" required>

      <label for="fecha_hora">Fecha y Hora</label>
      <input type="datetime-local" id="fecha_hora" name="fecha_hora" required>

      <button class="btn" type="submit">Guardar</button>
    </form>
  </div>
</div>

<script>
      function abrirModal() {
      document.getElementById('modal').style.display = 'block';
    }

    // Función para cerrar el modal de Crear Competencia
    function cerrarModal() {
      document.getElementById('modal').style.display = 'none';
    }
</script>
