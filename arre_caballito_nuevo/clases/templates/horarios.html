{% extends 'base.html' %}

{% load static %}  <!-- Cargar las etiquetas estáticas de Django -->

{% block title %}
    Horario Semanal
{% endblock %}

{% block content %}
    {% include 'tabla.html' %}

    {% if is_admin %}
<style>
    #contenedor-horario {
        margin-top: 20px;
    }

    #references-container {
        position: sticky;
        top: 80px;
        max-height: 600px;
        overflow-y: auto;
        background-color: rgba(108, 38, 58, 0.5);
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .reference-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 8px 12px;
        margin-bottom: 10px;
        box-shadow: 1px 1px 5px rgba(0,0,0,0.05);
    }

    .reference-color {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        margin-right: 10px;
        flex-shrink: 0;
    }

    .reference-text {
        flex-grow: 1;
        font-weight: 500;
        color: #333;
    }

    #tabla-container {
        background-color: #ffffff;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    .btn-primary {
        background-color: rgb(255, 10, 112);
        border-color: rgb(26, 26, 27);
    }

    .btn-primary:hover {
        background-color: rgb(12, 12, 12);
        border-color: #0056b3;
    }
</style>

        <div class="d-flex justify-content-between align-items-start mt-4 gap-4 flex-wrap">

            <!-- Botón para agregar clase -->
            <div class="mb-3">
                <a href="{% url 'agregar_clase' %}" class="btn btn-primary shadow">Agregar una clase</a>
            </div>

            <!-- Contenedor principal de tabla y referencias -->
            <div id="contenedor-horario" class="d-flex gap-4 w-100 flex-wrap">
                
                <!-- Contenedor de la tabla -->
                <div id="tabla-container" class="flex-grow-1 border rounded shadow-sm p-3 bg-white">
                    <!-- La tabla se carga con JS o con el include -->
                </div>

                <!-- Contenedor de las referencias -->
                <div id="references-container" class="border shadow-sm p-3 bg-light" style="min-width: 280px; max-width: 320px;">
                    <!-- Las referencias se insertan dinámicamente -->
                    <!-- Ejemplo estático para que veas cómo se vería -->
                    <div class="reference-item">
                        <div class="reference-color" style="background-color: #ff6666;"></div>
                        <div class="reference-text">.</div>
                    </div>
                    <div class="reference-item">
                        <div class="reference-color" style="background-color: #66ccff;"></div>
                        <div class="reference-text">.</div>
                    </div>
                    <div class="reference-item">
                        <div class="reference-color" style="background-color: #99cc99;"></div>
                        <div class="reference-text">.</div>
                    </div>
                </div>
            </div>
        </div>
    {% endif %}
{% endblock %}
