{% extends "base.html" %}

{% block content %}
  <h1>¿Estás seguro de que quieres eliminar esta sesión?</h1>
  <p>{{ sesion.id_clase.nombre }} - {{ sesion.dia }} - {{ sesion.turno }} - {{ sesion.hora_inicio }} - {{ sesion.id_profesor.nombre }}</p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit">Confirmar eliminación</button>
  </form>
  <a href="{% url 'listar_sesiones' %}">Cancelar</a>
{% endblock %}
