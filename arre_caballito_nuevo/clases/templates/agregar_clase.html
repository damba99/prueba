{% extends 'base.html' %}

{% load static %}  <!-- Cargar las etiquetas estáticas de Django -->

{% block title %}
    Horario Semanal
{% endblock %}

{% block content %}
<style>
    .hour-column, #tabla-container td {
        width: 100px; /* Ancho de las celdas para los días de la semana y las horas */
        border: 1px solid #000000; /* Bordes para las celdas */
    }
    #tabla-container table {
        border-collapse: collapse; /* No hay espacio entre las celdas */    
    }
    #tabla-container a {
        pointer-events: none; /* Deshabilita la interacción con los enlaces */
        color: #888; /* Cambia el color del enlace a gris para que parezca deshabilitado */
        text-decoration: none; /* Elimina el subrayado */
        cursor: pointer;
    }

</style>
    <h2>Agregar clase:</h2>
    <form action="" method="POST">
        {% csrf_token %}
    
        <!-- Select de Disciplina -->
        <label for="id_disciplina">Disciplina:</label>
        <select id="id_disciplina" name="id_disciplina" class="form-control" required>
            <option value="" disabled selected>Seleccione una Disciplina</option>
            {% for disciplina in disciplinas %}
            <option value="{{ disciplina.id_disciplina }}">{{ disciplina.nombre }}</option>
            {% endfor %}  <!-- Puedes agregar más disciplinas aquí -->
        </select>
    
        <br><br>
    
        <!-- Select de Categoría -->
        <label for="id_categoria">Categoría:</label>
        <select id="id_categoria" name="id_categoria" class="form-control" required>
            <option value="" disabled selected>Seleccione una Categoría</option>
            {% for categoria in categorias %}
                <option value="{{ categoria.id_categoria }}">{{ categoria.nombre }}</option>
            {% endfor %}            <!-- Puedes agregar más categorías aquí -->
        </select>
    
        <br><br>
    
        <!-- Botón para agregar sesión -->
        <button type="button" id="agregar-sesion-btn" class="btn btn-primary">Agregar sesión</button>
    
        <br><br>
    
        <!-- Contenedor para las sesiones -->
        <div id="sesiones-container"></div>
    
        <br><br>
    
        <button type="submit" class="btn btn-success">Guardar</button>
    </form>

    {% include 'tabla.html' %}
    <script>
 // Obtener el botón y el contenedor donde se agregarán las sesiones
        const agregarSesionBtn = document.getElementById('agregar-sesion-btn');
        const sesionesContainer = document.getElementById('sesiones-container');

        // Al hacer clic en el botón "Agregar sesión", se agrega un formulario de sesión
        agregarSesionBtn.addEventListener('click', function() {
            // Crear un nuevo contenedor para la sesión
            const sessionForm = document.createElement('div');
            sessionForm.classList.add('session-form');
            
            // HTML para el select de Día, hora de inicio y hora de fin
            sessionForm.innerHTML = `
                <h4>Sesión</h4>

                <!-- Select de Día -->
                <label for="dia">Día:</label>
                <select name="dia" class="form-control" required>
                    <option value="" disabled selected>Selecciona un Día</option>
                    <option value="Lunes">Lunes</option>
                    <option value="Martes">Martes</option>
                    <option value="Miércoles">Miércoles</option>
                    <option value="Jueves">Jueves</option>
                    <option value="Viernes">Viernes</option>
                    <option value="Sábado">Sábado</option>
                    <option value="Domingo">Domingo</option>
                </select>

                <br><br>

                <label for="id_profesor">Profesor:</label>
                <select id="id_profesor" name="id_profesor" class="form-control" required>
                    <option value="" disabled selected>Seleccione una profesor</option>
                    {% for profesor in profesores %}
                    <option value="{{ profesor.id_profesor }}">{{ profesor.nombre }} {{ profesor.apellido }}</option>
                    {% endfor %}            
                </select>

                <!-- Input de Hora de Inicio -->
                <label for="hora_inicio">Hora de Inicio:</label>
                <input type="time" name="hora_inicio" class="form-control" required>

                <br><br>

                <!-- Input de Hora de Fin -->
                <label for="hora_fin">Hora de Fin:</label>
                <input type="time" name="hora_fin" class="form-control" required>

                <br><br>
            `;

            // Agregar el nuevo formulario de sesión al contenedor
            sesionesContainer.appendChild(sessionForm);
        });
    </script>
{% endblock %}
