{% extends "base.html" %}

{% block content %}
  <h1>Modificar Profesor</h1>
  <form method="POST">
    {% csrf_token %}
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" value="{{ profesor.nombre }}" required>
    
    <label for="apellido">Apellido:</label>
    <input type="text" id="apellido" name="apellido" value="{{ profesor.apellido }}" required>
    
    <label for="dni">DNI:</label>
    <input type="text" id="dni" name="dni" value="{{ profesor.dni }}" required>
    
    <label for="fecha_nacimiento">Fecha de nacimiento:</label>
    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" value="{{ profesor.fecha_nacimiento }}" required>
    
    <label for="direccion">Dirección:</label>
    <input type="text" id="direccion" name="direccion" value="{{ profesor.direccion }}" required>
    
    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" name="telefono" value="{{ profesor.telefono }}">
    
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="{{ profesor.email }}" required>

    <button type="submit">Modificar</button>
  </form>
  <a href="{% url 'listar_profesores' %}">Volver a la lista</a>
{% endblock %}
