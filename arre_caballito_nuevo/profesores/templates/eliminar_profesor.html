{% extends "base.html" %}

{% block content %}
  <h1>¿Estás seguro de que quieres eliminar a {{ profesor.nombre }} {{ profesor.apellido }}?</h1>
  <form method="POST">
    {% csrf_token %}
    <button type="submit">Confirmar eliminación</button>
  </form>
  <a href="{% url 'listar_profesores' %}">Cancelar</a>
{% endblock %}
