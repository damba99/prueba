<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar/Modificar Caballo</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #d9b36b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-align: center;
        }

        form {
            background-color: #f3e1c3;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            width: 80%;
            max-width: 600px;
        }

        label {
            font-size: 18px;
            color: #8a6d35;
            margin-bottom: 10px;
            display: block;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 2px solid #8a6d35;
            border-radius: 5px;
        }

        button {
            background-color: #8a6d35;
            color: white;
            font-size: 18px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6b4f28;
        }

        .volver-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            border: 2px solid black;
            border-radius: 50px;
            background: #d9b36b;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button class="volver-btn" onclick="window.history.back()">Volver</button>
    <h1>{% if form.instance.id %}Modificar{% else %}Agregar{% endif %} Caballo</h1>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% if form.instance.id %}Modificar{% else %}Agregar{% endif %}</button>
    </form>

</body>
</html>
