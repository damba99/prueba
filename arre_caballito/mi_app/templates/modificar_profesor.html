<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Profesor</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Fade-in animation for the page */
        body {
            background-color: #d9b36b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* Container animation */
        .form-container {
            background-color: #f3e1c3;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
            transform: scale(0.9);
            animation: scaleUp 0.5s forwards;
        }

        @keyframes scaleUp {
            0% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        h2 {
            color: #8a6d35;
            margin-bottom: 20px;
            animation: fadeInText 1s ease-in-out;
        }

        @keyframes fadeInText {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        form {
            display: flex;
            flex-direction: column;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            margin-bottom: 5px;
            color: #8a6d35;
        }

        input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            transition: transform 0.3s, border-color 0.3s;
        }

        input:focus {
            transform: scale(1.02);
            border-color: #8a6d35;
        }

        button {
            padding: 10px;
            background-color: #8a6d35;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #6d4f24;
            transform: scale(1.05);
        }

        .volver-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            border: 2px solid black;
            border-radius: 50px;
            background: #d9b36b;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .volver-btn:hover {
            background-color: #a67524;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <button class="volver-btn" onclick="window.history.back()">Volver</button>
    <div class="form-container">
        <h2>Modificar Profesor</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar Cambios</button>
        </form>
    </div>
</body>
</html>
