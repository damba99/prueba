<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Razas</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f0e4d7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            color: #4e4e4e;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            color: #6b4f31;
            margin-bottom: 20px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        table {
            width: 80%;
            margin-top: 20px;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            color: #4e4e4e;
        }

        th {
            background-color: #8a6d35;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #dec295;
            transform: translateY(-5px);
            transition: transform 0.2s ease-in-out;
        }

        .no-data {
            text-align: center;
            font-size: 18px;
            color: #8a6d35;
            background-color: #fff;
            padding: 15px;
        }

        .button-container {
            margin-top: 20px;
            text-align: center;
        }

        .btn {
            padding: 10px 20px;
            background-color: #8a6d35;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.3s, transform 0.2s ease-in-out;
        }

        .btn:hover {
            background-color: #a67524;
            transform: scale(1.1);
        }

        .volver-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            border: 2px solid black;
            border-radius: 50px;
            background: #d9b36b;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .volver-btn:hover {
            background: #b08b4f;
        }

        /* Animations */
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <button class="volver-btn" onclick="window.location.href='{% url 'lista_alumnos' %}'">Volver</button>

    <h1>Lista de Razas</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for raza in razas %}
            <tr>
                <td>{{ raza.id_raza }}</td>
                <td>{{ raza.nombre }}</td>
                <td>
                    <button class="btn" onclick="modificarRaza({{ raza.id_raza }})">Modificar</button>
                    <button class="btn" onclick="confirmarEliminar({{ raza.id_raza }})">Eliminar</button>
                </td>
            </tr>
            {% empty %}
            <tr class="no-data">
                <td colspan="3">No hay razas registradas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <div class="button-container">
        <button class="btn" onclick="agregarRaza()">Agregar Raza</button>
    </div>
    <script>
        function agregarRaza() {
            window.location.href = "{% url 'agregar_raza' %}";
        }

        function modificarRaza(id) {
            window.location.href = `/modificar_raza/${id}/`;
        }

        function confirmarEliminar(id) {
            Swal.fire({
                title: '¿Estás seguro?',
                text: "Esta acción no se puede deshacer",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = `/eliminar_raza/${id}/`;

                    const csrfToken = document.createElement('input');
                    csrfToken.type = 'hidden';
                    csrfToken.name = 'csrfmiddlewaretoken';
                    csrfToken.value = "{{ csrf_token }}";
                    form.appendChild(csrfToken);

                    document.body.appendChild(form);
                    form.submit();
                }
            });
        }
    </script>
</body>
</html>
