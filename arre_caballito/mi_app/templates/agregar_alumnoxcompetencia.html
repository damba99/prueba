<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Alumno x Competencia</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Body Styling */
        body {
            background-color: #f7f3e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            animation: fadeIn 1s ease-in-out; /* Animation for page fade-in */
        }

        /* Fade-in animation */
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* Container Styling */
        .container {
            width: 100%;
            max-width: 500px;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            transform: scale(0.9);
            animation: scaleUp 0.6s ease-out forwards; /* Scale-up animation */
        }

        /* Scale-up animation */
        @keyframes scaleUp {
            0% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        h2 {
            color: #6b4f35;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            animation: fadeInText 1s ease-in-out; /* Fade-in text animation */
        }

        /* Fade-in text animation */
        @keyframes fadeInText {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            font-size: 18px;
            font-weight: 600;
            color: #6b4f35;
            text-align: left;
            transition: color 0.3s ease;
        }

        label:hover {
            color: #a67524;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            transition: border 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border: 2px solid #a67524;
            box-shadow: 0 0 10px rgba(166, 117, 36, 0.4);
        }

        button {
            padding: 14px;
            background-color: #a67524;
            color: white;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        button:hover {
            background-color: #8a6d35;
            transform: translateY(-3px);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            color: #6b4f35;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            text-decoration: underline;
            color: #a67524;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Agregar Alumno x Competencia</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar</button>
        </form>
        <a class="back-link" href="{% url 'lista_alumnos' %}">Volver a la lista de alumnos</a>
    </div>
</body>
</html>
