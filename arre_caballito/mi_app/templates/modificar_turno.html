<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Turno</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Fade-in animation for the page */
        body {
            background-color: #d9b36b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        h1 {
            color: black; /* Cambié el color a negro */
            margin-bottom: 20px;
            font-size: 2rem; /* Aumenté el tamaño de la fuente */
            animation: fadeInText 1s ease-in-out;
        }

        @keyframes fadeInText {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        form {
            background-color: #f3e1c3;
            padding: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transform: scale(0.9);
            animation: scaleUp 0.5s forwards;
        }

        @keyframes scaleUp {
            0% {
                transform: scale(0.9);
            }
            100% {
                transform: scale(1);
            }
        }

        label {
            color: black; /* Cambié el color a negro */
            font-size: 1.2rem; /* Aumenté el tamaño de la fuente */
        }

        input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            font-size: 1.1rem; /* Aumenté el tamaño de la fuente */
        }

        button {
            padding: 10px;
            background-color: #8a6d35;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1.2rem; /* Aumenté el tamaño de la fuente */
            transition: background-color 0.3s, transform 0.2s;
        }

        button:hover {
            background-color: #6d4f24;
            transform: scale(1.05);
        }

        a {
            margin-top: 15px;
            color: black;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        a:hover {
            color: #8a6d35;
        }
    </style>
</head>
<body>

    <h1>Modificar Turno</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Modificar</button>
    </form>

    <a href="{% url 'lista_turno' %}">Volver</a>

</body>
</html>
