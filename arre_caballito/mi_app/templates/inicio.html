<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuela Ecuestre Arre Caballito</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: white;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            padding: 15px 50px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .navbar .logo {
            display: flex;
            align-items: center;
        }
        .navbar .logo img {
            height: 50px;
        }
        .navbar .logo h1 {
            margin-left: 15px;
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            padding: 0;
        }
        .nav-links li {
            display: inline;
        }
        .nav-links a {
            text-decoration: none;
            color: black;
            font-size: 18px;
            font-weight: bold;
            padding: 10px;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #d4a017;
        }
        .carousel {
            position: relative;
            width: 100%;
            max-width: 100vw;
            overflow: hidden;
            margin-top: 50px;
        }
        .carousel img {
            width: 100%;
            height: 100vh; /* Ajusta el alto para que ocupe toda la altura de la pantalla */
            object-fit: contain; /* Esto asegura que la imagen se ajuste dentro del contenedor sin recortarse */
            display: none;
        }
        .carousel img.active {
            display: block;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="{% static 'imagen/Logo.jpeg' %}" alt="Logo">
            <h1> Arre Caballito</h1>
        </div>
        <ul class="nav-links">
            <li><a href="{% url 'nuestra_historia' %}">Nuestra Historia</a></li>
            <li><a href="{% url 'servicios' %}">Servicios</a></li>
            <li><a href="{% url 'contacto' %}">Contacto</a></li>
            <li><a href="{% url 'ubicacion' %}">Ubicación</a></li>
            <li><a href="{% url 'login' %}">Iniciar Sesión</a></li>
        </ul>
    </nav>

    <div class="carousel">
        <img src="{% static 'imagen/imagen1.jpg' %}" class="active" alt="Caballo 1">
        <img src="{% static 'imagen/imagen2.jpg' %}" alt="Caballo 2">
    </div>

    <script>
        let index = 0;
        function showNextImage() {
            const images = document.querySelectorAll('.carousel img');
            images[index].classList.remove('active');
            index = (index + 1) % images.length;
            images[index].classList.add('active');
        }
        setInterval(showNextImage, 3000);
    </script>
</body>
</html>
