<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clases</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Body Styling */
        body {
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Heading */
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        /* Table Styling */
        table {
            width: 90%;
            max-width: 1000px;
            border-collapse: collapse;
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            animation: slideUp 0.5s ease-out;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            color: #333; /* Texto negro */
        }

        th {
            background-color: #8a6d35; /* Color marrón dorado para encabezados */
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9; /* Filas alternas con un color más suave */
        }

        tr:hover {
            background-color: #f1e0a3;
            transform: translateY(-5px);
            transition: transform 0.2s ease-in-out;
        }

        .no-data {
            text-align: center;
            font-size: 18px;
            color: #8a6d35;
            background-color: #fff;
            padding: 15px;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            background-color: #8a6d35;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background-color 0.3s ease, transform 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background-color: #6b4f28;
            transform: translateY(-2px);
        }

        .volver-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            border: 2px solid black;
            border-radius: 50px;
            background: #d9b36b;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        .volver-btn:hover {
            background: #333;
            color: #fff;
        }

        /* Button Container */
        .button-container {
            text-align: center;
            margin-top: 20px;
        }

        /* Animations */
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

    </style>
</head>
<body>

    <button class="volver-btn" onclick="window.location.href='{% url 'lista_alumnos' %}'">Volver</button>
    <h1>Lista de Clases</h1>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Categoría</th>
                <th>Profesor</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for clase in clases %}
            <tr>
                <td>{{ clase.id_clase }}</td>
                <td>{{ clase.categoria }}</td>
                <td>{{ clase.profesor }}</td>
                <td>
                    <button class="btn" onclick="modificarClase({{ clase.id_clase }})">Modificar</button>
                    <button class="btn" onclick="confirmarEliminar({{ clase.id_clase }})">Eliminar</button>
                </td>
            </tr>
            {% empty %}
            <tr class="no-data">
                <td colspan="3">No hay clases registradas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

     <!-- Action Buttons -->
     <div class="button-container">
        <button class="btn" onclick="agregarClase()">Agregar Clase</button>
    </div>

    <!-- Scripts -->
    <script>
        function agregarClase() {
            window.location.href = "{% url 'agregar_clase' %}";
        }

        function modificarClase(id) {
            window.location.href = `/modificar_clase/${id}/`;
        }

        function confirmarEliminar(id) {
            Swal.fire({
                title: '¿Estás seguro?',
                text: "Esta acción no se puede deshacer",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    const form = document.createElement('form');
                    form.method = 'POST';
                    form.action = `/eliminar_clase/${id}/`;

                    const csrfToken = document.createElement('input');
                    csrfToken.type = 'hidden';
                    csrfToken.name = 'csrfmiddlewaretoken';
                    csrfToken.value = "{{ csrf_token }}";
                    form.appendChild(csrfToken);

                    document.body.appendChild(form);
                    form.submit();
                }
            });
        }
    </script>

</body>
</html>
