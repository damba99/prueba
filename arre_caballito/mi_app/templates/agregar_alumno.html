<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Alumno</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .content {
            width: 100%;
            max-width: 500px;
            background-color: #d2b48c;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            color: #4a2e17;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            color: #4a2e17;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #b1946e;
            border-radius: 8px;
            outline: none;
            transition: border 0.3s ease;
        }

        .form-group input:focus {
            border: 2px solid #8b7355;
        }

        .form-group input[type="submit"] {
            background-color: #5c3d1b;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .form-group input[type="submit"]:hover {
            background-color: #4a2e17;
        }

        .back-btn {
            display: block;
            margin-top: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            color: #5c3d1b;
            background-color: #fff;
            border: 2px solid #5c3d1b;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .back-btn:hover {
            background-color: #5c3d1b;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Agregar Alumno</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="form-group">
                <input type="submit" value="Guardar Alumno">
                <a href="{% url 'lista_alumnos' %}" class="back-btn">Volver a la lista</a>
            </div>
        </form>
    </div>
</body>
</html>
