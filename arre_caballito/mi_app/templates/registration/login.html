<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" 
          crossorigin="anonymous">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #d9b36b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            color: white;
        }

        .volver-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            border: 2px solid black;
            border-radius: 50px;
            background: #d9b36b;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: white;
        }

        .login-box {
            background-color: #dec295;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            text-align: left;
            width: 300px;
        }

        .login-box label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
            color: black;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .login-btn {
            display: block;
            background-color: #8a6d35;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .login-btn:hover, .volver-btn:hover {
            background-color: #6b5229;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="volver-btn" onclick="window.history.back()">Volver</button>
        <h1>INGRESA A LA PLATAFORMA</h1>
        <div class="login-box">
            <form action="" method="post">
                {% csrf_token %}
                <label for="username">NOMBRE DE USUARIO</label>
                {{ form.username }}
                <label for="password">CONTRASEÑA</label>
                {{ form.password }}
                <button type="submit" class="login-btn">ACCEDER</button>
            </form>
        </div>
    </div>
</body>
</html>
