<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso al sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" 
          crossorigin="anonymous">
    {% load static %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: url("{% static 'imagen/imagen1.jpg' %}"), url("{% static 'imagen/imagen2.jpg' %}"), url("{% static 'imagen/imagen3.jpg' %}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            animation: backgroundChange 30s infinite;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        @keyframes backgroundChange {
            0% {
                background-image: url("{% static 'imagen/imagen1.jpg' %}"), url("{% static 'imagen/imagen2.jpg' %}"), url("{% static 'imagen/imagen3.jpg' %}");
            }
            50% {
                background-image: url("{% static 'imagen/imagen2.jpg' %}"), url("{% static 'imagen/imagen3.jpg' %}"), url("{% static 'imagen/imagen1.jpg' %}");
            }
            100% {
                background-image: url("{% static 'imagen/imagen3.jpg' %}"), url("{% static 'imagen/imagen1.jpg' %}"), url("{% static 'imagen/imagen2.jpg' %}");
            }
        }

        .container {
            text-align: center;
            position: relative; /* Para posicionar el botón "Volver" */
        }

        .volver-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px; /* Aumentar el padding para un mejor aspecto */
            border: none;
            border-radius: 8px; /* Redondear un poco más los bordes */
            background-color: #333;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-size: 16px; /* Ajustar el tamaño de la fuente */
        }

        .volver-btn:hover {
            background-color: #d9a457;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px; /* Aumentar el tamaño de la fuente del título */
            color: #333;
        }

        .login-box {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px; /* Aumentar el padding del formulario */
            border-radius: 12px; /* Redondear más los bordes del formulario */
            display: inline-block;
            text-align: left;
            width: 350px; /* Aumentar el ancho del formulario */
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .login-box label {
            font-weight: bold;
            margin-top: 15px; /* Aumentar el margen superior de las etiquetas */
            display: block;
            color: #333;
            font-size: 18px; /* Aumentar el tamaño de la fuente de las etiquetas */
        }

        .login-box input {
            width: 100%;
            padding: 12px; /* Aumentar el padding de los campos de entrada */
            margin-top: 8px; /* Aumentar el margen superior de los campos de entrada */
            margin-bottom: 20px; /* Aumentar el margen inferior de los campos de entrada */
            border: 1px solid #ddd;
            border-radius: 8px; /* Redondear más los bordes de los campos de entrada */
            font-size: 16px; /* Aumentar el tamaño de la fuente de los campos de entrada */
        }

        .login-btn {
            display: block;
            background-color: #d9a457;
            color: white;
            border: none;
            padding: 12px; /* Aumentar el padding del botón "Acceder" */
            width: 100%;
            border-radius: 8px; /* Redondear más los bordes del botón "Acceder" */
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background-color 0.3s ease;
            font-size: 18px; /* Aumentar el tamaño de la fuente del botón "Acceder" */
        }

        .login-btn:hover {
            background-color: #b37d4b;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="volver-btn" onclick="window.history.back()">Volver</button>
        <h1>INGRESA A LA PLATAFORMA</h1>
        <div class="login-box">
            <form action="" method="post">
                {% csrf_token %}
                <label for="username">NOMBRE DE USUARIO</label>
                {{ form.username }}
                <label for="password">CONTRASEÑA</label>
                {{ form.password }}
                <button type="submit" class="login-btn">ACCEDER</button>
            </form>
        </div>
    </div>
</body>
</html>
